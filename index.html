
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>경기도일자리재단 뉴스 대시보드</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f3f5f8;
  margin: 0;
  padding: 30px;
  color: #222;
}
.container {
  max-width: 1000px;
  margin: auto;
}
h1 { color: #17365d; }
.panel {
  background: white;
  padding: 24px;
  border-radius: 12px;
  margin-top: 20px;
}
input, select, button {
  padding: 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 15px;
}
input { width: 55%; }
button {
  background: #17365d;
  color: white;
  cursor: pointer;
}
#result {
  margin-top: 20px;
  line-height: 1.8;
}
</style>
</head>
<body>
<div class="container">
  <h1>경기도일자리재단 뉴스 대시보드</h1>
  <p>재단 관련 언론 보도를 검색하고 관리하는 공간</p>

  <div class="panel">
    <h3>뉴스 검색</h3>
    <input id="keyword" value="경기도일자리재단">
    <select id="period">
      <option>최신순</option>
      <option>정확도순</option>
    </select>
    <button onclick="searchNews()">검색</button>
    <div id="result">검색어를 입력하고 검색을 눌러주세요.</div>
  </div>

  <div class="panel">
    <h3>주요 검색 키워드</h3>
    <button onclick="setKeyword('경기도일자리재단')">재단</button>
    <button onclick="setKeyword('경기도기술학교')">기술학교</button>
    <button onclick="setKeyword('경기도 청년 일자리')">청년 일자리</button>
    <button onclick="setKeyword('중장년 취업')">중장년</button>
  </div>
</div>

<script>
function searchNews() {
  const keyword =
    document.getElementById('keyword').value;
  const period =
    document.getElementById('period').value;

  document.getElementById('result').innerHTML =
    '<b>검색어:</b> ' + keyword +
    '<br><b>정렬:</b> ' + period +
    '<br><br>화면 준비 완료! 다음 단계에서 뉴스 API를 연결합니다.';
}
function setKeyword(keyword) {
  document.getElementById('keyword').value = keyword;
  searchNews();
}
</script>
</body>
</html>
