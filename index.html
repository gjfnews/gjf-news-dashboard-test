
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>경기도일자리재단 뉴스 대시보드</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, "Malgun Gothic", sans-serif;
  background: #f3f5f8;
  margin: 0;
  padding: 24px;
  color: #222;
}

.container {
  max-width: 1000px;
  margin: auto;
}

h1 {
  color: #17365d;
  line-height: 1.4;
}

.panel {
  background: white;
  padding: 24px;
  border-radius: 12px;
  margin-top: 20px;
  box-shadow: 0 2px 8px #0000000a;
}

input, select, button {
  padding: 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 15px;
}

input {
  width: 55%;
  max-width: 100%;
}

button {
  background: #17365d;
  color: white;
  cursor: pointer;
  margin: 3px;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

.news {
  padding: 18px 0;
  border-bottom: 1px solid #e5e7eb;
}

.news:last-child {
  border-bottom: none;
}

.news a {
  color: #17365d;
  font-size: 17px;
  font-weight: bold;
  text-decoration: none;
}

.news a:hover {
  text-decoration: underline;
}

.description {
  line-height: 1.7;
  margin: 8px 0;
  overflow-wrap: anywhere;
}

.meta {
  color: #777;
  font-size: 13px;
}

#status {
  margin-top: 16px;
  line-height: 1.6;
}

@media(max-width:600px) {
  body {
    padding: 12px;
  }

  .panel {
    padding: 16px;
  }

  input, select {
    width: 100%;
    margin-bottom: 8px;
  }

  #searchButton {
    width: 100%;
  }
}
</style>
</head>

<body>
<div class="container">

  <h1>경기도일자리재단 뉴스 대시보드</h1>
  <p>재단 관련 언론 보도를 검색하고 관리하는 공간</p>

  <div class="panel">
    <h3>뉴스 검색</h3>

    <input
      id="keyword"
      value="경기도일자리재단"
      placeholder="검색어를 입력하세요"
      onkeydown="if(event.key==='Enter') searchNews()"
    >

    <select id="period">
      <option value="date">최신순</option>
      <option value="sim">정확도순</option>
    </select>

    <button id="searchButton" onclick="searchNews()">
      검색
    </button>

    <div id="status">
      검색어를 입력하고 검색을 눌러주세요.
    </div>

    <div id="result"></div>
  </div>

  <div class="panel">
    <h3>주요 검색 키워드</h3>

    <button onclick="setKeyword('경기도일자리재단')">
      경기도일자리재단
    </button>

    <button onclick="setKeyword('경기도기술학교')">
      기술학교
    </button>

    <button onclick="setKeyword('경기도 일자리')">
      경기도 일자리
    </button>
  </div>

</div>

<script>
const API_URL = "https://gjf-news-api.sol-945.workers.dev";

// 검색어별 기사 필터 기준
const FILTER_RULES = [
  {
    keyword: "경기도일자리재단",
    terms: ["경기도일자리재단"]
  },
  {
    keyword: "경기도기술학교",
    terms: ["경기도기술학교"]
  },
  {
    keyword: "경기도 일자리",
    terms: ["경기도 일자리"]
  }
];

// HTML 특수문자 정리
function cleanText(value) {
  const textarea = document.createElement("textarea");
  textarea.innerHTML = value || "";
  return textarea.value
    .replace(/<[^>]*>/g, "")
    .replace(/&quot;|&#34;|&#x22;/gi, '"')
    .replace(/&apos;|&#39;|&#x27;/gi, "'");
}

// 검색어에 맞는 필터 기준 찾기
function getFilterTerms(keyword) {
  const rule = FILTER_RULES.find(
    item => item.keyword === keyword
  );

  // 사용자 입력 검색어는 입력한 문구를 기준으로 필터링
  return rule ? rule.terms : [keyword];
}

async function searchNews() {
  const keyword = document.getElementById("keyword").value.trim();
  const sort = document.getElementById("period").value;
  const status = document.getElementById("status");
  const result = document.getElementById("result");
  const button = document.getElementById("searchButton");

  if (!keyword) {
    status.textContent = "검색어를 입력해 주세요.";
    return;
  }

  button.disabled = true;
  status.textContent = "뉴스를 검색하고 있습니다...";
  result.replaceChildren();

  try {
    const url = API_URL
      + "/?keyword=" + encodeURIComponent(keyword)
      + "&sort=" + encodeURIComponent(sort);

    const response = await fetch(url);
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "뉴스 검색에 실패했습니다.");
    }

    const items = Array.isArray(data.items) ? data.items : [];
    const terms = getFilterTerms(keyword);

    // 제목 또는 요약에 해당 검색어가 있는 기사만 표시
    const filteredItems = items.filter(item => {
      const title = cleanText(item.title || "");
      const description = cleanText(item.description || "");
      const content = title + " " + description;

      return terms.some(term => content.includes(term));
    });

    if (filteredItems.length === 0) {
      status.textContent =
        "가져온 기사 " + items.length
        + "건 중 검색어 '" + keyword
        + "'가 제목이나 요약에 포함된 기사가 없습니다.";

      return;
    }

    status.textContent =
      "가져온 기사 " + items.length
      + "건 중 검색어 포함 기사 "
      + filteredItems.length + "건 표시"
      + " (전체 검색 결과 "
      + Number(data.total || 0).toLocaleString()
      + "건)";

    filteredItems.forEach(item => {
      const article = document.createElement("div");
      article.className = "news";

      const link = document.createElement("a");
      link.href = item.link || item.originallink || "#";
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = cleanText(item.title || "제목 없음");

      const description = document.createElement("div");
      description.className = "description";
      description.textContent = cleanText(item.description || "");

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = item.pubDate
        ? "발행일: " + item.pubDate
        : "";

      article.append(link, description, meta);
      result.appendChild(article);
    });

  } catch (error) {
    status.textContent =
      "뉴스를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.";
    console.error(error);

  } finally {
    button.disabled = false;
  }
}

function setKeyword(keyword) {
  document.getElementById("keyword").value = keyword;
  searchNews();
}
</script>

</body>
</html>
